# School Management backend — API + MySQL (local development).
#   docker compose up -d --build
# API on port 8000. The API container creates/upgrades the schema on start (Alembic).
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: schoolroot
      MYSQL_DATABASE: school_app
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pschoolroot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: mysql+pymysql://root:schoolroot@db:3306/school_app
      MYSQL_SOCKET_PATH: ""            # force TCP inside Docker
      DB_SSL_CA: ""                    # the local MySQL container has no public TLS certificate
      SECRET_KEY: local-development-secret-key-change-me
      FORWARDED_ALLOW_IPS: "127.0.0.1" # port 8000 is exposed directly: don't trust X-Forwarded-For
      LOG_FORMAT: text
    volumes:
      - uploads_data:/app/uploads      # persist photos / lesson files / papers
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
