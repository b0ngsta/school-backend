# Database migrations.  Usage (from the project root):
#   alembic upgrade head          apply everything pending
#   alembic current               show where the database is
#   alembic history               list revisions
#   alembic revision -m "add x"   create a new (hand-written SQL) revision
# The connection comes from DATABASE_URL / DB_SSL_CA (same as the app).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
